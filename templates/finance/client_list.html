{% extends "base.html" %}
{% block content %}
<h2>Клиенты</h2>
<a href="{% url 'client_create' %}">+ Добавить клиента</a>
<table>
  <tr><th>Название</th><th>Тип</th><th>Контакты</th><th></th></tr>
  {% for c in clients %}
  <tr>
    <td>{{ c.name }}</td>
    <td>{{ c.get_client_type_display }}</td>
    <td>{{ c.contacts }}</td>
    <td>
      <form class="inline" method="post" action="{% url 'client_delete' c.pk %}">
        {% csrf_token %}<button type="submit">Удалить</button>
      </form>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="4">Клиентов пока нет.</td></tr>
  {% endfor %}
</table>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<h2>Расходы</h2>
<a href="{% url 'expense_create' %}">+ Добавить расход</a>
<table>
  <tr><th>Дата</th><th>Категория</th><th>Сумма</th><th>Описание</th><th></th></tr>
  {% for e in expenses %}
  <tr>
    <td>{{ e.date|date:"d.m.Y" }}</td>
    <td>{{ e.category }}</td>
    <td>{{ e.amount }}</td>
    <td>{{ e.description }}</td>
    <td>
      <form class="inline" method="post" action="{% url 'expense_delete' e.pk %}">
        {% csrf_token %}<button type="submit">Удалить</button>
      </form>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="5">Расходов пока нет.</td></tr>
  {% endfor %}
</table>
{% endblock %}

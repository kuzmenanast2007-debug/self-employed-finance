{% extends "base.html" %}
{% block content %}
<h2>Категории расходов</h2>
<a href="{% url 'category_create' %}">+ Добавить категорию</a>
<table>
  <tr><th>Название</th><th></th></tr>
  {% for c in categories %}
  <tr>
    <td>{{ c.name }}</td>
    <td>
      <form class="inline" method="post" action="{% url 'category_delete' c.pk %}">
        {% csrf_token %}<button type="submit">Удалить</button>
      </form>
    </td>
  </tr>
  {% empty %}
  <tr><td colspan="2">Категорий пока нет.</td></tr>
  {% endfor %}
</table>
{% endblock %}
